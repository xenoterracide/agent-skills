- name: hemingway triggers when writing a skill
  prompt: write a skill that helps format commit messages
  expect:
    type: skill
    name: hemingway
- name: hemingway triggers when writing javadoc
  prompt: write javadoc for Greeter.java
  fixture: java-class
  expect:
    type: skill
    name: hemingway
- name: hemingway prose rule applies
  prompt: |
    rewrite this to be terse:
    It is important to note that you should run the tests.
  expect:
    type: contains
    text: Run the tests
- name: hemingway triggers when editing a skill reference
  prompt: tighten the wording in the pull-request reference
  expect:
    type: skill
    name: hemingway
